<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#F3F4F6;font-family:Arial,Helvetica,sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:12px;">
      <tr>
        <td style="background:#1F2937;color:#FFFFFF;padding:16px 24px;border-radius:12px 12px 0 0;font-size:18px;font-weight:bold;">
          DCU Active
        </td>
      </tr>
      <tr>
        <td style="padding:24px;">
          <p style="margin:0 0 16px;font-size:16px;">Welcome to DCU Active. Use this code to verify your email address:</p>
          <p style="margin:0 0 24px;font-size:32px;font-weight:bold;letter-spacing:6px;color:#C8102E;">{{ .Token }}</p>
          <p style="margin:0 0 16px;font-size:14px;color:#4B5563;">Or open the confirmation page and press <strong>Confirm my email</strong>:</p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
               style="display:inline-block;background:#C8102E;color:#FFFFFF;text-decoration:none;padding:12px 20px;border-radius:8px;font-size:16px;">
              Open confirmation page
            </a>
          </p>
          <p style="margin:0;font-size:13px;color:#4B5563;">The code expires in 60 minutes. If you did not create a DCU Active account, you can ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
